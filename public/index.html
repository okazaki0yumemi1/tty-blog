<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tty-blog ~ guest@tty-blog: ~</title>
  <script>
    // Derive the app's base path from the browser's own URL, so the frontend
    // works at "/" and behind any reverse-proxy prefix (e.g. /tty-blog/) —
    // even when the proxy strips the prefix and the server cannot know it.
    (function () {
      var p = location.pathname;
      var base = p.charAt(p.length - 1) === '/' ? p : p.replace(/[^/]*$/, '');
      document.write('<base href="' + base.replace(/["<>]/g, encodeURIComponent) + '">');
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
  <div class="terminal-window" id="window">
    <div class="titlebar">
      <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
      <div class="title">guest@tty-blog: ~ — read-only</div>
      <div class="titlebar-right">bash</div>
    </div>
    <div class="screen" id="screen">
      <div id="output" aria-live="polite"></div>
      <div class="input-line" id="inputLine">
        <span class="prompt"><span class="p-user">guest</span>@<span class="p-host">tty-blog</span>:<span class="p-path">~</span><span class="p-dollar">$</span></span>
        <input class="cmd-input" id="cmdInput" type="text" inputmode="text" enterkeyhint="done"
          autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" translate="no"
          aria-label="terminal command input" />
      </div>
    </div>
  </div>
  <script src="vendor/marked.umd.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
